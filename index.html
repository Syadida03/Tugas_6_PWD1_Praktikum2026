<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Show Password - Sesuai Materi</title>
  </head>
  <body>
    <!-- Kotak input 1: Mode password (tanpa value, pakai placeholder) -->
    <input type="password" id="inputSandi" placeholder="Masukkan password" />

    <!-- Kotak input 2: Mode teks biasa (awalnya disembunyikan) -->
    <input type="text" id="inputTeks" placeholder="Masukkan password" style="display: none" />

    <br /><br />

    <!-- Checkbox Show -->
    <input type="checkbox" id="showCheckbox" />
    <label for="showCheckbox">Show</label>

    <!-- Memanggil library jQuery offline sesuai file kamu -->
    <script src="jquery-4.0.0.min.js"></script>
    <!-- Memanggil file JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
